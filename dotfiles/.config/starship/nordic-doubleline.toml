format = """
[](#2E3440)\
$directory\
[](fg:#2E3440 bg:#3b4252)\
$git_branch\
$git_status\
[](fg:#3b4252 bg:#262A2E)\
$nodejs\
$rust\
$golang\
$php\
[](#262A2E)
$character"""

right_format = """
[](fg:#4c566a)\
$time\
$cmd_duration\
$package\
$jobs\
$os\
[](fg:#4c566a)\
"""

[package]
symbol = "󰏖"
style = "bg:#4c566a"
format = '[[ $symbol ($version) ](fg:#000000 bg:#4c566a)]($style)'

[jobs]
symbol = ""
style = "bg:#4c566a"
format = "[ [$symbol ($number)](fg:#000000 $style) ]($style)"

[cmd_duration]
style = "bg:#313539"
format = '[[ $duration ](fg:#000000 bg:#4c566a)]($style)'

[directory]
style = "fg:#dfe3e8 bg:#2E3440"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b4252"
format = '[[ $symbol $branch ](fg:#dfe3e8 bg:#3b4252)]($style)'

[git_status]
style = "bg:#3b4252"
format = '[[($all_status$ahead_behind )](fg:#dfe3e8 bg:#3b4252)]($style)'
conflicted = ' '
ahead = '→${count} '
behind = '←${count} '
modified = '󰏫 '
untracked = '? '
stashed = '≡ '
staged = '+ '
renamed = '. '
diverged = '⇌ '
deleted = ' '

[nodejs]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[rust]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[os]
disabled = false
style = "fg:#000000 bg:#4c566a"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
openSUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = ""
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
NixOS = ""

[golang]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[php]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[lua]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[python]
symbol = ""
style = "bg:#262a2e"
format = '[[ $symbol ($version) ](fg:#94cdf7 bg:#262a2e)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#4c566a"
format = '[[ 󰥔 $time ](fg:#000000 bg:#4c566a)]($style)'
